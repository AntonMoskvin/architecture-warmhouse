version: '3.8'

services:
  # База данных
  postgres:
    image: postgres:16
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 10s
      timeout: 30s
      retries: 5

    networks:
      smarthome-network:
        aliases:
          - postgres

  # SmartHome API
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    image: smarthome-app
    container_name: smarthome-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/smarthome?sslmode=disable"
      TEMPERATURE_API_URL: "http://temperature-api:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smarthome-network

  # Temperature API (Java + Spring Boot / любой другой микросервис)
  temperature-api:
    build:
      context: ./temperature-api   # Путь к папке с Dockerfile
      dockerfile: Dockerfile       # Имя Dockerfile (можно переименовать при необходимости)
    image: temperature-api
    container_name: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

networks:
  smarthome-network:
    driver: bridge